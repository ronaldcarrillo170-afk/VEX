<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09070d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/logo.png">
<title>Registro | VEX STORE</title>
<link rel="stylesheet" href="registro.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>
<div class="background"></div>

<div class="registro-box">
<img src="img/logo.png" class="logo" alt="VEX logo">
<h1>Crear Cuenta</h1>
<p>Únete a VEX STORE</p>

<form id="registroForm">
<div class="input-box">
<i class="fa-solid fa-user"></i>
<input type="text" id="nombre" placeholder="Nombre completo" required>
</div>

<div class="input-box">
<i class="fa-solid fa-envelope"></i>
<input type="email" id="correo" placeholder="Correo" required>
</div>

<div class="input-box">
<i class="fa-solid fa-phone"></i>
<input type="tel" id="telefono" placeholder="Teléfono" required>
</div>

<div class="input-box">
<i class="fa-solid fa-location-dot"></i>
<input type="text" id="direccion" placeholder="Dirección" required>
</div>

<div class="input-box">
<i class="fa-solid fa-lock"></i>
<input type="password" id="password" placeholder="Contraseña" required>
</div>

<div class="input-box">
<i class="fa-solid fa-lock"></i>
<input type="password" id="confirmar" placeholder="Confirmar contraseña" required>
</div>

<button type="submit">Registrarme</button>
<p id="mensaje"></p>
</form>

<div class="links">
<a href="login.html">¿Ya tienes cuenta? Inicia sesión</a>
</div>
</div>

<script src="registro.js"></script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("./service-worker.js");</script>
</body>
</html>
